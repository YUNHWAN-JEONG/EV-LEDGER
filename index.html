<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2347E6">
<title>전기차 가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink: '#0E1320', paper: '#F3F5F9', line: '#E2E7F0',
            cobalt: { 50: '#EEF3FF', 100: '#DCE6FF', 600: '#2F5BFF', 700: '#2447D6' } },
  fontFamily: { sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', '"Apple SD Gothic Neo"', '"Malgun Gothic"', 'sans-serif'] }
} } };
</script>
<style type="text/tailwindcss">
  @layer components {
    .inp  { @apply w-full h-12 px-3 rounded-xl border border-slate-300 bg-white text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-cobalt-600/30 focus:border-cobalt-600; }
    .lbl  { @apply block text-sm font-medium text-slate-600 mb-1; }
    .btn  { @apply h-12 px-4 rounded-xl font-semibold text-base transition active:scale-[.98]; }
    .card { @apply bg-white rounded-[20px] border border-line p-4; }
    .btn-sm { @apply h-10 px-3 rounded-lg text-sm font-medium active:scale-[.97]; }
  }
  body { -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .safe-b { padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body class="bg-paper text-slate-900">

<script>
/* ============================================================
   ⚙️ 설정: Google Apps Script 웹 앱 URL을 여기에 입력하세요.
   예) const API_URL = 'https://script.google.com/macros/s/AKfycb.../exec';
   비워두면 "데모 모드"로 동작하며 이 기기(브라우저)에만 저장됩니다.
   ============================================================ */
const API_URL   = 'https://script.google.com/macros/s/AKfycbwZUwznZWShD6JA2AgR5MC19XyPlTL03ZO1l-DkOgTTgR26JEJRKB1eQ7VB09nxBKHT/exec';
</script>

<div id="app" class="max-w-md mx-auto min-h-screen">
  <header id="header" class="p-4 pb-2"></header>
  <main id="view" class="px-4 pb-32 space-y-3"></main>
</div>

<nav id="nav" class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-line safe-b z-20">
  <div id="navInner" class="max-w-md mx-auto grid grid-cols-5"></div>
</nav>

<div id="loading" class="hidden fixed inset-0 bg-black/30 z-40 flex items-center justify-center">
  <div class="bg-white rounded-2xl px-6 py-4 text-base font-medium shadow-lg">처리 중…</div>
</div>
<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-50 max-w-[90%] px-4 py-3 rounded-xl text-white text-sm shadow-lg"></div>

<script>
/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => Number(n || 0).toLocaleString('ko-KR', { maximumFractionDigits: d });
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const IC = {
  layout:  '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  zap:     '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  wallet:  '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  car:     '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  wrench:  '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  logout:  '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  user:    '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  mail:    '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  pencil:  '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trash:   '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  left:    '<path d="m15 18-6-6 6-6"/>',
  right:   '<path d="m9 18 6-6-6-6"/>'
};
const icon = (n, c = 'w-5 h-5') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class="${c} shrink-0" aria-hidden="true">${IC[n]}</svg>`;
const sum = (arr, k) => arr.reduce((a, b) => a + (Number(b[k]) || 0), 0);

/* ---------- 상태 ---------- */
const LS_KEY = 'ev-ledger-v1';
const SES_KEY = 'ev-ledger-session';
let SESSION = '';                                   // 로그인 토큰
let USER = API_URL ? null : { id: 'demo', name: '데모' };   // 데모 모드(API_URL 없음)는 로그인 없이 동작
try { SESSION = localStorage.getItem(SES_KEY) || ''; } catch (e) {}
const needLogin = () => !!API_URL && !USER;
const state = { vehicle: null, charges: [], subsidies: [], maintenance: [] };
const ui = {
  tab: 'dashboard',
  month: today().slice(0, 7),
  authMode: 'login',
  filter: { charges: '', subsidies: '', maintenance: '' },
  editing: { charges: null, subsidies: null, maintenance: null }
};
const SUBSIDY_TYPES = ['회사 지원금', '카드 캐쉬백', '정부 지원금', '기타'];
const MAINT_TYPES   = ['타이어', '오일류', '에어컨 필터', '기타 부품'];

/* ---------- API (Google Apps Script) ---------- */
async function apiCall(body) {
  const r = await fetch(API_URL, {                  // 모든 요청은 POST (text/plain → CORS preflight 회피)
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, token: SESSION })
  });
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('서버 응답을 읽을 수 없어요. 배포 설정을 확인해 주세요'); }
  if (!j.ok) { const e = new Error(j.error || '요청 실패'); e.code = j.code; throw e; }
  return j;
}
async function apiGetAll() {
  if (!API_URL) { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : {}; }
  return apiCall({ action: 'getAll' });
}
async function apiPost(body) {
  if (!API_URL) return { ok: true };
  return apiCall(body);
}

/* ---------- 로그인 / 회원가입 ---------- */
function setSession(token, user) {
  SESSION = token; USER = user;
  try { localStorage.setItem(SES_KEY, token); } catch (e) {}
}
function clearSession() {
  SESSION = ''; USER = null;
  try { localStorage.removeItem(SES_KEY); } catch (e) {}
  state.vehicle = null; state.charges = []; state.subsidies = []; state.maintenance = [];
  ui.tab = 'dashboard';
}
async function authSubmit(mode, form) {
  const fd = new FormData(form);
  const id = (fd.get('id') || '').trim(), pw = fd.get('pw') || '';
  if (!/^[a-z0-9]{4,8}$/.test(id)) return toast('ID는 영문 소문자·숫자 4~8자예요', true);
  if (!/^\d{4}$/.test(pw)) return toast('패스워드는 숫자 4자리예요', true);
  let body = { action: 'login', id, pw };
  if (mode === 'signup') {
    const name = (fd.get('name') || '').trim(), email = (fd.get('email') || '').trim();
    if (!name) return toast('이름을 입력해 주세요', true);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('메일 주소를 확인해 주세요', true);
    if (pw !== fd.get('pw2')) return toast('패스워드 확인이 일치하지 않아요', true);
    body = { action: 'signup', name, id, email, pw };
  }
  showLoading(true);
  try {
    const j = await apiCall(body);
    setSession(j.token, j.user);
    toast(mode === 'signup' ? '가입이 완료되었어요' : j.user.name + '님 환영해요');
  } catch (e) { showLoading(false); return toast('⚠ ' + e.message, true); }
  showLoading(false);
  await loadAll();
}
const persistLocal = () => { if (!API_URL) localStorage.setItem(LS_KEY, JSON.stringify(state)); };

function normalize(data) {
  state.vehicle = data.vehicle && data.vehicle.name !== undefined ? data.vehicle : null;
  for (const k of ['charges', 'subsidies', 'maintenance']) {
    state[k] = (data[k] || []).map(r => ({ ...r, amount: Number(r.amount) || 0, kwh: Number(r.kwh) || 0, unitPrice: Number(r.unitPrice) || 0, odometer: Number(r.odometer) || 0, month: r.month || String(r.date || '').slice(0, 7) }));
  }
}
async function loadAll() {
  if (API_URL && !SESSION) { render(); return; }
  showLoading(true);
  try {
    const j = await apiGetAll();
    if (API_URL) USER = j.user;
    normalize(j);
  }
  catch (e) {
    if (e.code === 'AUTH') { clearSession(); toast('다시 로그인해 주세요', true); }
    else toast('⚠ ' + e.message, true);
  }
  finally { showLoading(false); render(); }
}
async function run(fn, okMsg) {
  showLoading(true);
  try { await fn(); persistLocal(); if (okMsg) toast(okMsg); showLoading(false); render(); }
  catch (e) {
    showLoading(false); toast('⚠ ' + e.message, true);
    if (e.code === 'AUTH') { clearSession(); render(); }
  }
}

/* ---------- UI 헬퍼 ---------- */
function showLoading(on) { $('#loading').classList.toggle('hidden', !on); }
let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-50 max-w-[90%] px-4 py-3 rounded-xl text-white text-sm shadow-lg ' + (bad ? 'bg-rose-600' : 'bg-slate-800');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2500);
}
const chips = (name, opts, sel, cols) => `
  <div class="grid grid-cols-${cols} gap-2">
    ${opts.map(o => `
      <label class="cursor-pointer">
        <input type="radio" name="${name}" value="${o}" class="peer sr-only" ${o === sel ? 'checked' : ''}>
        <span class="flex items-center justify-center h-12 rounded-xl border border-slate-300 bg-white text-base font-medium text-slate-600 peer-checked:bg-cobalt-600 peer-checked:border-cobalt-600 peer-checked:text-white">${o}</span>
      </label>`).join('')}
  </div>`;
const sorted = k => [...state[k]].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.id).localeCompare(String(a.id)));
const filtered = k => sorted(k).filter(r => !ui.filter[k] || r.month === ui.filter[k]);

function listHeader(k, label) {
  const list = filtered(k);
  return `
  <div class="flex items-end gap-2 pt-2">
    <div class="flex-1">
      <label class="lbl">${label} 조회월</label>
      <input type="month" id="flt-${k}" class="inp" value="${ui.filter[k]}">
    </div>
    <button data-act="fltclear" data-k="${k}" class="btn bg-white border border-slate-300 text-slate-700">전체</button>
  </div>
  <div class="text-sm text-slate-500 px-1">${list.length}건 · 합계 ${fmt(sum(list, 'amount'))}원${k === 'charges' ? ` · ${fmt(sum(list, 'kwh'), 1)}kWh` : ''}</div>`;
}
const rowActions = (k, id) => `
  <div class="flex gap-2 mt-3">
    <button data-act="edit" data-k="${k}" data-id="${esc(id)}" class="btn-sm flex-1 inline-flex items-center justify-center gap-1.5 bg-slate-100 text-slate-700">${icon('pencil', 'w-4 h-4')}수정</button>
    <button data-act="del"  data-k="${k}" data-id="${esc(id)}" class="btn-sm flex-1 inline-flex items-center justify-center gap-1.5 bg-rose-50 text-rose-600">${icon('trash', 'w-4 h-4')}삭제</button>
  </div>`;
const formButtons = (k, editing) => `
  <div class="flex gap-2 pt-1">
    ${editing ? `<button type="button" data-act="cancel" data-k="${k}" class="btn bg-white border border-slate-300 text-slate-700 flex-1">취소</button>` : ''}
    <button type="submit" class="btn bg-cobalt-600 text-white flex-[2]">${editing ? '수정 저장' : '저장'}</button>
  </div>`;
const emptyBox = msg => `<div class="card text-center text-slate-400 py-8">${msg}</div>`;

/* ---------- 헤더(차량 카드) ---------- */
function renderHeader() {
  const v = state.vehicle;
  // 이번 달 충전량을 배터리 용량과 비교: 1회분 = 가득 충전 1번. 막대는 가득 채운 횟수(×N)를 뺀 나머지 비율.
  const cap = v ? Number(v.battery) || 0 : 0;
  const kwhMonth = sum(state.charges.filter(r => r.month === today().slice(0, 7)), 'kwh');
  const ratio = cap ? kwhMonth / cap : 0;
  const full = Math.floor(ratio + 1e-9);
  const frac = ratio - full;
  const isFull = full >= 1 && frac < 0.005;
  const segs = ratio <= 0 ? 0 : isFull ? 20 : Math.max(1, Math.round(frac * 20));
  const pct = isFull ? 100 : Math.round(frac * 100);
  const bar = Array.from({ length: 20 }, (_, i) => `<span class="h-2 flex-1 rounded-[2px] ${i < segs ? 'bg-[#7CF0FF]' : 'bg-white/20'}"></span>`).join('');
  const odoMax = Math.max(0, ...state.charges.map(r => r.odometer || 0));   // 기록된 가장 큰 주행거리
  const ibtn = (act, ic, label) => `<button data-act="${act}" aria-label="${label}" class="h-9 w-9 rounded-full bg-white/15 flex items-center justify-center text-white active:bg-white/25">${icon(ic, 'w-[18px] h-[18px]')}</button>`;
  $('#header').innerHTML = `
  <div class="rounded-[20px] bg-gradient-to-br from-[#2347E6] to-[#0D9BE0] text-white p-4">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 text-xs text-white/75 min-w-0">${icon('user', 'w-3.5 h-3.5')}<span class="truncate">${esc(USER ? USER.name : '')}</span></div>
      <div class="flex items-center gap-2">${ibtn('reload', 'refresh', '새로고침')}${API_URL ? ibtn('logout', 'logout', '로그아웃') : ''}</div>
    </div>
    ${v ? `
    <div class="mt-4">
      <div class="text-[22px] font-bold tracking-tight leading-tight">${esc(v.name)}</div>
      ${v.grade ? `<div class="text-sm text-white/75 mt-0.5">${esc(v.grade)}</div>` : ''}
    </div>
    <div class="mt-4 flex items-center justify-between gap-3">
      <span class="inline-flex items-center rounded-md bg-white text-ink px-2.5 py-1 text-[15px] font-extrabold tracking-wide">${esc(v.plate || '번호 미등록')}</span>
      <div class="text-right text-xs text-white/75 leading-snug"><div>구매 ${esc(v.purchaseDate || '-')}</div>${odoMax ? `<div>총 주행 <b class="text-white">${fmt(odoMax)} km</b></div>` : ''}</div>
    </div>
    <div class="mt-4">
      <div class="flex items-baseline justify-between text-xs text-white/75 mb-1.5">
        <span>이번 달 충전 · 배터리 ${cap ? fmt(cap, 1) + 'kWh' : '-'}</span>
        <span class="text-sm font-semibold text-white">${cap ? fmt(ratio, 1) + '회분' : ''}</span>
      </div>
      ${cap ? `
      <div class="flex items-center gap-2">
        ${full >= 1 ? `<span class="shrink-0 text-xs font-bold bg-white text-cobalt-700 rounded-md px-1.5 py-0.5">×${full}</span>` : ''}
        <div class="flex gap-[3px] flex-1">${bar}</div>
        <span class="shrink-0 text-xs text-white/80 w-9 text-right">${pct}%</span>
      </div>
      <div class="text-[11px] text-white/70 mt-1.5">${fmt(kwhMonth, 1)} kWh 충전</div>` : `<div class="text-[11px] text-white/70">차량 탭에서 배터리 용량을 입력하면 표시돼요</div>`}
    </div>` : `
    <div class="mt-4 text-lg font-bold">차량을 등록해 주세요</div>
    <button data-act="tab" data-tab="vehicle" class="mt-3 h-10 px-4 rounded-xl bg-white text-cobalt-700 text-sm font-semibold">차량 등록하기</button>`}
    ${API_URL ? '' : '<div class="mt-4 text-[11px] text-white/60">데모 모드 · 이 기기에만 저장돼요</div>'}
  </div>`;
}

/* ---------- 하단 네비 ---------- */
const TABS = [['dashboard','대시보드','layout'],['charges','충전','zap'],['subsidies','지원금','wallet'],['vehicle','차량','car'],['maintenance','정비','wrench']];
function renderNav() {
  $('#navInner').innerHTML = TABS.map(([id, label, ic]) => {
    const on = ui.tab === id;
    return `
    <button data-act="tab" data-tab="${id}" class="relative h-16 flex flex-col items-center justify-center gap-1 ${on ? 'text-cobalt-600' : 'text-slate-400'}">
      ${on ? '<span class="absolute top-0 h-[3px] w-8 rounded-b-full bg-cobalt-600"></span>' : ''}
      ${icon(ic, 'w-[22px] h-[22px]')}<span class="text-[11px] ${on ? 'font-bold' : 'font-medium'}">${label}</span>
    </button>`;
  }).join('');
}

/* ---------- 뷰: 대시보드 ---------- */
function viewDashboard() {
  const m = ui.month;
  const ch = state.charges.filter(r => r.month === m);
  const sb = state.subsidies.filter(r => r.month === m);
  const mt = state.maintenance.filter(r => r.month === m);
  const tAmt = sum(ch, 'amount'), tKwh = sum(ch, 'kwh');
  const avg = tKwh ? tAmt / tKwh : 0;
  const fast = ch.filter(r => r.type === '급속').length;
  const slow = ch.filter(r => r.type === '완속').length;
  const tSub = sum(sb, 'amount'), tMnt = sum(mt, 'amount');
  const head = (ic, tone, title, count) => `
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-[10px] flex items-center justify-center ${tone}">${icon(ic, 'w-[18px] h-[18px]')}</span><h2 class="font-bold">${title}</h2></div>
      <span class="text-xs text-slate-400">${count}건</span>
    </div>`;
  const big = (v, size) => `<div class="mt-4 flex items-baseline gap-1"><span class="${size} leading-none font-bold tracking-tight">${fmt(v)}</span><span class="text-base font-semibold text-slate-400">원</span></div>`;
  const cell = (label, val, cls) => `<div class="${cls}"><dt class="text-xs text-slate-500">${label}</dt><dd class="text-[17px] font-bold mt-0.5">${val}</dd></div>`;
  const dot = c => `<span class="inline-block w-2 h-2 rounded-full ${c} mr-1.5"></span>`;
  return `
  <div class="bg-white rounded-[20px] border border-line p-2 flex items-center gap-2">
    <button data-act="mprev" aria-label="이전 달" class="h-12 w-12 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center">${icon('left')}</button>
    <input type="month" id="dash-month" class="inp text-center font-semibold border-0 bg-transparent" value="${m}">
    <button data-act="mnext" aria-label="다음 달" class="h-12 w-12 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center">${icon('right')}</button>
  </div>

  <section class="card">

/* ---------- 뷰: 로그인 / 회원가입 ---------- */
function authView() {
  const m = ui.authMode;
  const tab = (id, label) => `<button type="button" data-act="authmode" data-mode="${id}" class="flex-1 h-11 rounded-lg font-semibold ${m === id ? 'bg-white shadow text-cobalt-700' : 'text-slate-500'}">${label}</button>`;
  const login = `
  <form id="f-login" class="card space-y-3 mt-3">
    <div><label class="lbl">ID</label><input name="id" class="inp" maxlength="8" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
    <div><label class="lbl">패스워드 (숫자 4자리)</label><input type="password" name="pw" class="inp" inputmode="numeric" maxlength="4" autocomplete="current-password" required></div>
    <button type="submit" class="btn bg-cobalt-600 text-white w-full">로그인</button>
  </form>`;
  const signup = `
  <form id="f-signup" class="card space-y-3 mt-3">
    <div><label class="lbl">이름</label><input name="name" class="inp" maxlength="20" autocomplete="name" required></div>
    <div><label class="lbl">ID (영문 소문자·숫자 4~8자)</label><input name="id" class="inp" maxlength="8" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
    <div><label class="lbl">메일 (리포트 받을 메일)</label><input type="email" name="email" class="inp" autocomplete="email" required></div>
    <div><label class="lbl">패스워드 (숫자 4자리)</label><input type="password" name="pw" class="inp" inputmode="numeric" maxlength="4" autocomplete="new-password" required></div>
    <div><label class="lbl">패스워드 확인</label><input type="password" name="pw2" class="inp" inputmode="numeric" maxlength="4" autocomplete="new-password" required></div>
    <button type="submit" class="btn bg-cobalt-600 text-white w-full">가입하기</button>
  </form>`;
  return `
  <div class="pt-12 pb-5 text-center">
    <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-[#2347E6] to-[#0D9BE0] text-white flex items-center justify-center">${icon('zap', 'w-7 h-7')}</div>
    <h1 class="text-2xl font-bold tracking-tight mt-4">전기차 가계부</h1>

  <div class="bg-slate-200 rounded-xl p-1 flex gap-1">${tab('login', '로그인')}${tab('signup', '회원가입')}</div>
  ${m === 'login' ? login : signup}`;
}
function bindAuth() {
  document.querySelectorAll('#view input[name=pw], #view input[name=pw2]').forEach(i =>
    i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 4); }));
  document.querySelectorAll('#view input[name=id]').forEach(i =>
    i.addEventListener('input', () => { i.value = i.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8); }));
  for (const mode of ['login', 'signup']) {
    const f = $('#f-' + mode);
    if (f) f.addEventListener('submit', ev => { ev.preventDefault(); authSubmit(mode, f); });
  }
}

const VIEWS = { dashboard: viewDashboard, charges: viewCharges, subsidies: viewSubsidies, vehicle: viewVehicle, maintenance: viewMaintenance };

/* ---------- 렌더 ---------- */
function render() {
  if (needLogin()) {
    $('#header').innerHTML = '';
    $('#nav').classList.add('hidden');
    $('#view').innerHTML = authView();
    bindAuth();
    return;
  }
  $('#nav').classList.remove('hidden');
  renderHeader();
  $('#view').innerHTML = VIEWS[ui.tab]();
  renderNav();
  bindForms();
}

/* ---------- 폼 바인딩 ---------- */
function bindForms() {
  // 날짜 → 월 자동 추출
  const monthMap = { charges: '#c-month', subsidies: '#s-month', maintenance: '#m-month' };
  for (const k in monthMap) {
    const f = $('#f-' + k);
    if (!f) continue;
    f.elements.date.addEventListener('change', ev => { $(monthMap[k]).value = ev.target.value.slice(0, 7); });
    f.addEventListener('submit', ev => { ev.preventDefault(); submitLog(k, f); });
  }
  // 평균 단가 자동 계산
  const kwh = $('#c-kwh'), amt = $('#c-amount'), unit = $('#c-unit');
  if (kwh && amt && unit) {
    const calc = () => { const k = parseFloat(kwh.value), a = parseFloat(amt.value); unit.value = k > 0 && a >= 0 ? fmt(Math.round(a / k * 10) / 10, 1) : ''; };
    kwh.addEventListener('input', calc); amt.addEventListener('input', calc);
  }
  const fv = $('#f-vehicle');
  if (fv) fv.addEventListener('submit', ev => { ev.preventDefault(); submitVehicle(fv); });
}

function upsert(k, rec) {
  const i = state[k].findIndex(r => r.id === rec.id);
  if (i >= 0) state[k][i] = rec; else state[k].push(rec);
}

function submitLog(k, form) {
  const fd = new FormData(form);
  const date = fd.get('date');
  const amount = Number(fd.get('amount'));
  if (!date) return toast('날짜를 선택해 주세요', true);
  if (!(amount > 0)) return toast('금액을 입력해 주세요', true);
  const rec = { date, month: date.slice(0, 7), amount };
  if (k === 'charges') {
    const kwh = Number(fd.get('kwh'));
    if (!(kwh > 0)) return toast('충전량을 입력해 주세요', true);
    const odoRaw = String(fd.get('odometer') || '').trim();
    const odo = odoRaw === '' ? '' : Number(odoRaw);
    if (odo !== '' && !(odo > 0 && odo <= 9999999)) return toast('총 주행거리를 확인해 주세요', true);
    if (odo !== '') {   // 이전 기록보다 작으면 오타일 수 있어 한 번 확인
      const prevMax = Math.max(0, ...state.charges.filter(r => r.id !== ui.editing.charges && r.odometer && String(r.date) <= date).map(r => r.odometer));
      if (prevMax > odo && !confirm(`이전 기록(${fmt(prevMax)} km)보다 작아요. 그대로 저장할까요?`)) return;
    }
    Object.assign(rec, {
      station: (fd.get('station') || '').trim(), company: (fd.get('company') || '').trim(),
      type: fd.get('type'), kwh, unitPrice: Math.round(amount / kwh * 10) / 10, odometer: odo
    });
  } else if (k === 'subsidies') {
    Object.assign(rec, { description: (fd.get('description') || '').trim(), type: fd.get('type') });
  } else {
    Object.assign(rec, { category: fd.get('category'), memo: (fd.get('memo') || '').trim() });
  }
  const id = ui.editing[k];
  rec.id = id || uid();
  run(async () => {
    await apiPost({ action: id ? 'update' : 'add', sheet: k, data: rec });
    upsert(k, rec);
    ui.editing[k] = null;
  }, id ? '수정했어요' : '저장했어요');
}

function submitVehicle(form) {
  const fd = new FormData(form);
  const v = {
    id: 'main',
    name: (fd.get('name') || '').trim(), grade: (fd.get('grade') || '').trim(),
    plate: (fd.get('plate') || '').trim(), purchaseDate: fd.get('purchaseDate') || '',
    battery: Number(fd.get('battery')) || 0
  };
  if (!v.name) return toast('차량명을 입력해 주세요', true);
  run(async () => {
    await apiPost({ action: 'saveVehicle', sheet: 'vehicle', data: v });
    state.vehicle = v;
  }, '차량 정보를 저장했어요');
}

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const { act, k, id, tab, mode } = el.dataset;
  if (act === 'tab')    { ui.tab = tab; render(); window.scrollTo(0, 0); }
  else if (act === 'reload') loadAll();
  else if (act === 'authmode') { ui.authMode = mode; render(); }
  else if (act === 'logout') { if (confirm('로그아웃할까요?')) { clearSession(); render(); } }
  else if (act === 'report') {
    const scope = el.dataset.scope;
    run(async () => { await apiPost({ action: 'sendReport', scope, month: ui.month }); }, (USER && USER.email ? USER.email + ' (으)로 ' : '') + '자료를 보냈어요');
  }
  else if (act === 'mprev' || act === 'mnext') {
    const [y, m] = ui.month.split('-').map(Number);
    const d = new Date(y, m - 1 + (act === 'mnext' ? 1 : -1), 1);
    ui.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    render();
  }
  else if (act === 'fltclear') { ui.filter[k] = ''; render(); }
  else if (act === 'edit')   { ui.editing[k] = id; render(); window.scrollTo(0, 0); }
  else if (act === 'cancel') { ui.editing[k] = null; render(); }
  else if (act === 'del') {
    if (!confirm('이 기록을 삭제할까요?')) return;
    run(async () => {
      await apiPost({ action: 'delete', sheet: k, id });
      state[k] = state[k].filter(r => r.id !== id);
      if (ui.editing[k] === id) ui.editing[k] = null;
    }, '삭제했어요');
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'dash-month' && ev.target.value) { ui.month = ev.target.value; render(); }
  else if (ev.target.id && ev.target.id.startsWith('flt-')) { ui.filter[ev.target.id.slice(4)] = ev.target.value; render(); }
});

loadAll();
</script>
</body>
</html>
